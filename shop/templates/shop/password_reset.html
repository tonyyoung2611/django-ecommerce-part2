
{% extends 'shop/base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<h1>Forgot Your Password?</h1>

<p>
    Enter your email address below,
    and we'll send you instructions
    to reset your password.
</p>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Reset Password
    </button>
</form>

<p>
    <a href="{% url 'login' %}">
        Back to Login
    </a>
</p>

{% endblock %}
