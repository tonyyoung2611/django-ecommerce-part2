
{% extends 'shop/base.html' %}

{% block title %}Edit Product{% endblock %}

{% block content %}

<h1>Edit Product</h1>

<h2>{{ product.name }}</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Changes
    </button>
</form>

<p>
    <a href="{% url 'vendor_dashboard' %}">
        Back to Vendor Dashboard
    </a>
</p>

{% endblock %}
