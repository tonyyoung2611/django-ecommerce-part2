
{% extends 'shop/base.html' %}

{% block title %}Create an Account{% endblock %}

{% block content %}

<h1>Create an Account</h1>

<h2>Register as a Buyer or Vendor</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Register</button>
</form>

<p>
    Already have an account?
    <a href="{% url 'login' %}">
        Login here
    </a>
</p>

<p>
    <a href="{% url 'product_list' %}">
        Back to Store
    </a>
</p>

{% endblock %}
